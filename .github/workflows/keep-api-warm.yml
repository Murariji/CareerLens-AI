# Pings the free Render backend every 10 minutes so it doesn't go to sleep
# (free instances sleep after ~15 minutes without traffic, and waking takes 30-60 s).
# Free for public repositories. GitHub may delay scheduled runs by a few minutes at busy times,
# and pauses schedules after 60 days without commits; re-enable from the Actions tab if that happens.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://careerlens-ai-z6xa.onrender.com/api/health
